name: Build

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

defaults:
  run:
    working-directory: ext

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4', '8.5', '8.6' ]
        ts: [ 'ts', 'nts' ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Build
        run: |
          phpize
          ./configure
          make
      - name: Test
        env:
          TEST_PHP_ARGS: "-q" #do not try to submit failures
        run: make test TESTS=--show-diff

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4', '8.5', '8.6' ]
        ts: [ 'ts', 'nts' ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
        env:
          phpts: ${{ matrix.ts }}

      - name: build
        run: |
          phpize
          ./configure
          make

      - name: test
        env:
          TEST_PHP_ARGS: "-q" #do not try to submit failures
        run: make test TESTS=--show-diff

  windows:
    # Needs the 14.29, 14.44 and 14.5x MSVC toolsets for vs16, vs17 and vs18.
    runs-on: windows-2025
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5', '8.6']
        ts: ['ts', 'nts']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The builder names artifacts after the ref without sanitizing it,
      # and interpolates it into a PowerShell string.
      - name: Artifact ref
        id: ref
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ref = if ($env:VERSION) { $env:VERSION } else { $env:GITHUB_REF_NAME }
          $ref = $ref -replace '[^A-Za-z0-9._-]', '-'
          Write-Host "Artifact ref: $ref"
          "name=$ref" >> $env:GITHUB_OUTPUT
      # php-windows-builder 1.9.0 cannot build from a subdirectory of a
      # local checkout. It moves the subdirectory into its build directory,
      # then reads config.w32 from the checkout root.
      - name: Move extension to repository root
        working-directory: .
        run: |
          Copy-Item -Path ext\* -Destination . -Recurse -Force
          Remove-Item -Path ext -Recurse -Force
      - name: Build, test and upload
        uses: php/php-windows-builder/extension@29352c0ef9e8ce65264ea9e287881a6f7758a953 # 1.9.0
        with:
          php-version: ${{ matrix.php }}
          arch: x64
          ts: ${{ matrix.ts }}
          args: --enable-apm_ext
          extension-ref: ${{ steps.ref.outputs.name }}

  release-if-tag:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows]
    permissions:
      contents: write # required for creating releases
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each Windows artifact holds a ready-made zip, plus logs/ which the
      # release glob does not reach.
      - name: Download Windows binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: php_opentelemetry-*
          merge-multiple: true
          path: ext/artifacts
      - name: zip
        run: |
          cd artifacts
          find . -maxdepth 1 -type d -exec zip -jr {}.zip {} \;
      - name: Release
        # `gh release` cannot replicate this action's create-or-update behaviour
        # on re-run, and rewriting release automation is out of scope here.
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # zizmor: ignore[superfluous-actions] v3.0.0
        with:
          generate_release_notes: true
          draft: true
          files: "ext/artifacts/*.zip"
